services:

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:15
    container_name: postgres_dw
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auto_warehouse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/init.sql

  postgres_airflow:
    image: postgres:15
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:2.9.0-python3.11
    container_name: airflow
    depends_on: 
      - postgres_airflow
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "supersecretkey123"
      # Dépendances supplémentaires nécessaires pour vos scripts
      _PIP_ADDITIONAL_REQUIREMENTS: "boto3 langdetect psycopg2-binary pandas"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scrapers:/opt/scrapers
      - ./spark:/opt/spark-jobs
      - ./quality:/opt/quality
      - ./governance:/opt/governance
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true && airflow webserver & airflow scheduler"

  scraper:
    image: python:3.11
    container_name: scraper
    depends_on: [minio, kafka]
    volumes:
      - ./scrapers:/app
    command: bash -c "pip install -r requirements.txt && tail -f /dev/null"
    working_dir: /app

  spark:
    image: python:3.11
    container_name: spark
    depends_on: [minio]
    volumes:
      - ./spark:/opt/spark-jobs
      - ./quality:/opt/quality
      - ./governance:/opt/governance
    command: bash -c "pip install boto3 pandas psycopg2-binary langdetect && tail -f /dev/null"
    environment:
      - PYTHONPATH=/opt/spark-jobs:/opt/quality:/opt/governance

  dashboard:
    image: python:3.11
    container_name: dashboard
    depends_on:
      - postgres
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    working_dir: /app
    command: bash -c "pip install streamlit pandas psycopg2-binary plotly && streamlit run dashboard.py --server.address 0.0.0.0"

volumes:
  minio_data:
  postgres_data:
  postgres_airflow_data: